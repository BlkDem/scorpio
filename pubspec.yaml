name: scorpion
description: "Пасьянс «Скорпион» — реалистичный карточный пасьянс на Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
