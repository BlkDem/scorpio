<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Пасьянс «Скорпион»: реалистичные карты, анимации, подсказки и статистика.">
  <meta name="theme-color" content="#0B100D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Скорпион">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Скорпион — пасьянс</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B100D; overflow: hidden; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 35%, #1d5a36 0%, #0f3420 55%, #0B100D 100%);
      color: #E9C46A; font: 600 15px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .08em;
      transition: opacity .35s ease;
    }
    #loader .ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid rgba(233, 196, 106, .2); border-top-color: #E9C46A;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loader .ring { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="loader"><div class="ring"></div><div>СКОРПИОН</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (!l) return;
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
